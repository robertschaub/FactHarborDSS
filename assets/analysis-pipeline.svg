<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1520" viewBox="0 0 1000 1520" role="img" aria-labelledby="title desc"><title id="title">Planned analysis pipeline with selective agent debate</title><desc id="desc">Requests are framed within scope and authority, and permitted evidence is acquired or replayed. Claim and later decision methods remain distinct. The controller admits only required or justified debate tasks. Advocate, Challenger and Self-consistency tasks are possible contributions, not a mandatory chain; reconciliation records reasons and uncertainty. The direct route still goes through mandatory semantic and trusted checks. The controller can refine, re-challenge, request input, limit, hold or stop within the same allowance. Only valid report editions and recipient-specific release checks lead to permitted output. External actions require separate authorization. Debate is broader planned scope, not required for the initial development milestone.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#80636b"/></marker></defs>
 <style>text{font-family:Arial,sans-serif;fill:#443d38}.title{font-size:29px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:16px}.tag{font-size:15px;font-weight:700;letter-spacing:1px}.line{fill:none;stroke:#80636b;stroke-width:2.5;marker-end:url(#arrow)}.muted{fill:#71645b}</style>
<rect width="1000" height="1520" rx="16" fill="#fbf7f0"/>
<text x="500" y="43" class="title" text-anchor="middle">From evidence to a challenged, inspectable result</text>
<text x="500" y="73" class="small" text-anchor="middle">Planned broader pipeline · selective debate, not a fixed chain of agents</text>
<rect x="200" y="100" width="600" height="90" rx="12" fill="#f1e5d6" stroke="#80636b" stroke-width="1.8"/>
<text x="500.0" y="131" class="head" text-anchor="middle">1  Frame the request and plan</text>
<text x="500.0" y="159" class="body" text-anchor="middle">Preserve scope; adopt human decision criteria when needed</text>
<path class="line" d="M500 190 V218"/>
<rect x="200" y="225" width="600" height="90" rx="12" fill="#f4e5ce" stroke="#80636b" stroke-width="1.8"/>
<text x="500.0" y="256" class="head" text-anchor="middle">2  Acquire or replay permitted evidence</text>
<text x="500.0" y="284" class="body" text-anchor="middle">Exact versions, passages, coverage and explicit gaps</text>
<path class="line" d="M500 315 V340 H270 V358"/>
<path class="line" d="M500 340 H730 V358"/>
<rect x="60" y="365" width="420" height="100" rx="12" fill="#f1e5d6" stroke="#80636b" stroke-width="1.8"/>
<text x="270.0" y="396" class="head" text-anchor="middle">Claim assessment</text>
<text x="270.0" y="424" class="body" text-anchor="middle">Support, counterevidence and scope</text>
<text x="270.0" y="449" class="body" text-anchor="middle">Truth assessment + separate confidence</text>
<rect x="520" y="365" width="420" height="100" rx="12" fill="#f1e5d6" stroke="#80636b" stroke-width="1.8"/>
<text x="730.0" y="396" class="head" text-anchor="middle">Decision comparison · later</text>
<text x="730.0" y="424" class="body" text-anchor="middle">Adopted goals, feasible options, trade-offs</text>
<text x="730.0" y="449" class="body" text-anchor="middle">Conditional recommendation, not a truth score</text>
<path class="line" d="M270 465 V490 H500 V513"/>
<path class="line" d="M730 465 V490 H500" style="marker-end:none"/>
<rect x="250" y="520" width="500" height="85" rx="12" fill="#eee5ed" stroke="#80636b" stroke-width="1.8"/>
<text x="500.0" y="551" class="head" text-anchor="middle">3  Controller selects debate tasks</text>
<text x="500.0" y="579" class="body" text-anchor="middle">Required or justified tasks within current limits</text>
<path class="line" d="M250 563 H45 V1018 H247"/>
<text x="130" y="645" class="small" text-anchor="middle">No extra</text>
<text x="130" y="670" class="small" text-anchor="middle">agent required</text>
<text x="130" y="711" class="small" text-anchor="middle">Baseline</text>
<text x="130" y="736" class="small" text-anchor="middle">counterevidence</text>
<text x="130" y="761" class="small" text-anchor="middle">review remains</text>
<rect x="205" y="640" width="770" height="295" rx="15" fill="#f3e5ec" stroke="#a27088" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="590" y="672" class="tag" text-anchor="middle">CONDITIONAL AGENT DEBATE · LATER CAPABILITY</text>
<path class="line" d="M500 605 V633" stroke-dasharray="7 5"/>
<path class="line" d="M590 685 V697 H335 V708" stroke-dasharray="7 5"/>
<path class="line" d="M590 697 V708" stroke-dasharray="7 5"/>
<path class="line" d="M590 697 H845 V708" stroke-dasharray="7 5"/>
<rect x="225" y="715" width="220" height="105" rx="12" fill="#fbf7f0" stroke="#80636b" stroke-width="1.8"/>
<text x="335.0" y="746" class="head" text-anchor="middle">Advocate</text>
<text x="335.0" y="774" class="body" text-anchor="middle">Evidence-backed case</text>
<text x="335.0" y="799" class="body" text-anchor="middle">Expose assumptions</text>
<rect x="480" y="715" width="220" height="105" rx="12" fill="#fbf7f0" stroke="#80636b" stroke-width="1.8"/>
<text x="590.0" y="746" class="head" text-anchor="middle">Challenger</text>
<text x="590.0" y="774" class="body" text-anchor="middle">Counterevidence</text>
<text x="590.0" y="799" class="body" text-anchor="middle">Defects / specialist view</text>
<rect x="735" y="715" width="220" height="105" rx="12" fill="#fbf7f0" stroke="#80636b" stroke-width="1.8"/>
<text x="845.0" y="746" class="head" text-anchor="middle">Self-consistency</text>
<text x="845.0" y="774" class="body" text-anchor="middle">Reasoning stability</text>
<text x="845.0" y="799" class="body" text-anchor="middle">Agreement is not proof</text>
<path class="line" d="M335 820 V840 H590" style="marker-end:none"/>
<path class="line" d="M590 820 V853"/>
<path class="line" d="M845 820 V840 H590" style="marker-end:none"/>
<rect x="295" y="855" width="590" height="75" rx="12" fill="#fbf7f0" stroke="#80636b" stroke-width="1.8"/>
<text x="590.0" y="886" class="head" text-anchor="middle">Reconciler</text>
<text x="590.0" y="914" class="body" text-anchor="middle">Accept / reject / unresolved · revise with reasons</text>
<path class="line" d="M590 935 V954 H500 V973"/>
<path class="line" d="M590 930 V935" style="marker-end:none"/>
<rect x="250" y="980" width="500" height="90" rx="12" fill="#e8efec" stroke="#56766b" stroke-width="1.8"/>
<text x="500.0" y="1011" class="head" text-anchor="middle">4  Mandatory validation + checkpoint</text>
<text x="500.0" y="1039" class="body" text-anchor="middle">Semantic Validator role + trusted code checks</text>
<rect x="785" y="975" width="190" height="140" rx="12" fill="#f1e5d6" stroke="#80636b" stroke-width="1.8"/>
<text x="880.0" y="1006" class="head" text-anchor="middle">Controller</text>
<text x="880.0" y="1034" class="body" text-anchor="middle">May refine or</text>
<text x="880.0" y="1059" class="body" text-anchor="middle">re-challenge, ask,</text>
<text x="880.0" y="1084" class="body" text-anchor="middle">limit, hold or stop</text>
<text x="880.0" y="1109" class="body" text-anchor="middle">Same total limits</text>
<path class="line" d="M750 1025 H780"/>
<path class="line" d="M500 1070 V1138"/>
<text x="515" y="1110" class="small" text-anchor="start">Eligible report candidate</text>
<rect x="200" y="1145" width="600" height="95" rx="12" fill="#e8efec" stroke="#80636b" stroke-width="1.8"/>
<text x="500.0" y="1176" class="head" text-anchor="middle">5  Finalize report and check release</text>
<text x="500.0" y="1204" class="body" text-anchor="middle">Preserve findings, objections, reasons and caveats</text>
<text x="500.0" y="1229" class="body" text-anchor="middle">Current checks for the exact recipient and view</text>
<path class="line" d="M500 1240 V1283"/>
<text x="515" y="1258" class="small" text-anchor="start">If permitted</text>
<text x="515" y="1279" class="small" text-anchor="start">Otherwise withhold; permitted status only</text>
<rect x="250" y="1290" width="500" height="65" rx="12" fill="#dde9e2" stroke="#56766b" stroke-width="1.8"/>
<text x="500.0" y="1321" class="head" text-anchor="middle">Permitted report / evidence view</text>
<text x="500" y="1394" class="small" text-anchor="middle">A required task or check cannot be skipped because resources run out.</text>
<text x="500" y="1423" class="small" text-anchor="middle">Consensus grants neither truth nor permission. External actions have a separate gate.</text>
<a href="https://robertschaub.github.io/FactHarbor/diagrams/homepage-method.svg">
<text x="500" y="1461" class="small" text-anchor="middle">Adapted from a diagram by FactHarbor contributors</text>
