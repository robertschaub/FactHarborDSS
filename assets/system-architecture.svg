<text x="180.0" y="801" class="head" text-anchor="middle">Application PostgreSQL</text>
<text x="180.0" y="829" class="body" text-anchor="middle">Cases and permissions</text>
<text x="180.0" y="854" class="body" text-anchor="middle">Captured evidence / passages</text>
<text x="180.0" y="879" class="body" text-anchor="middle">Assessments and reports</text>
<text x="180.0" y="904" class="body" text-anchor="middle">Durable jobs and task state</text>
<rect x="355" y="770" width="290" height="115" rx="12" fill="#eee5ed" stroke="#80636b" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="500.0" y="801" class="head" text-anchor="middle">Source Reliability service</text>
<text x="500.0" y="829" class="body" text-anchor="middle">Exact evaluation versions</text>
<text x="500.0" y="854" class="body" text-anchor="middle">Refresh is a separate task</text>
<path class="line" d="M500 885 V920"/>
<rect x="355" y="925" width="290" height="100" rx="12" fill="#eee5ed" stroke="#80636b" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="500.0" y="956" class="head" text-anchor="middle">Separate PostgreSQL</text>
<text x="500.0" y="984" class="body" text-anchor="middle">Source / publisher evaluations</text>
<text x="500.0" y="1009" class="body" text-anchor="middle">and their provenance</text>
<rect x="675" y="770" width="290" height="170" rx="12" fill="#f4e5ce" stroke="#80636b" stroke-width="1.8"/>
<text x="820.0" y="801" class="head" text-anchor="middle">External sources / models</text>
<text x="820.0" y="829" class="body" text-anchor="middle">Configured search and fetch</text>
<text x="820.0" y="854" class="body" text-anchor="middle">Approved model providers</text>
<text x="820.0" y="879" class="body" text-anchor="middle">Current checks per call</text>
<text x="820.0" y="904" class="body" text-anchor="middle">Permitted input only</text>
<text x="180" y="971" class="small" text-anchor="middle">Retained evidence + full-text search</text>
<text x="500" y="1056" class="small" text-anchor="middle">Dashed: first-milestone reliability integration remains an open choice.</text>
<text x="500" y="1085" class="small" text-anchor="middle">Databases may share a server. These boxes do not imply process isolation.</text>
</svg>
