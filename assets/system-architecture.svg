<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1115" viewBox="0 0 1000 1115" role="img" aria-labelledby="title desc"><title id="title">Planned system architecture</title><desc id="desc">A TypeScript browser exchanges authorized requests and permitted views with one modular .NET 10 application. Trusted policy and orchestration admit tasks and check release. Its co-hosted worker shares evidence, assessment and reporting modules. PostgreSQL stores application records and durable jobs. Source Reliability has a service interface and a separate database; first-milestone integration remains an open scope choice. External search, fetch and model calls require current disclosure checks. These are planned responsibilities, not implemented controls or isolated processes.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#80636b"/></marker></defs>
 <style>text{font-family:Arial,sans-serif;fill:#443d38}.title{font-size:29px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:16px}.tag{font-size:15px;font-weight:700;letter-spacing:1px}.line{fill:none;stroke:#80636b;stroke-width:2.5;marker-end:url(#arrow)}.muted{fill:#71645b}</style>
<rect width="1000" height="1115" rx="16" fill="#fbf7f0"/>
<text x="500" y="43" class="title" text-anchor="middle">Planned system architecture</text>
<text x="500" y="72" class="small" text-anchor="middle">One modular application · durable state · explicit trust boundaries</text>
