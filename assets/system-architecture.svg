<text x="500.0" y="131" class="head" text-anchor="middle">Browser interface · TypeScript</text>
<text x="500.0" y="159" class="body" text-anchor="middle">Human requests and permitted evidence / report views</text>
<path class="line" d="M500 185 V240" marker-start="url(#arrow)"/>
<text x="515" y="220" class="small" text-anchor="start">Authenticated requests / checked release</text>
<rect x="30" y="245" width="940" height="445" rx="18" fill="#f8f0e9" stroke="#654751" stroke-width="2.5"/>
<text x="60" y="281" class="tag" text-anchor="start">C# / .NET 10 APPLICATION</text>
<text x="940" y="281" class="small" text-anchor="end">UI assets served here</text>
<rect x="60" y="300" width="880" height="90" rx="12" fill="#e8efec" stroke="#56766b" stroke-width="1.8"/>
<text x="500.0" y="331" class="head" text-anchor="middle">Trusted policy and orchestration</text>
<text x="500.0" y="359" class="body" text-anchor="middle">Cases and permissions · admit tasks · bound resources · check output release</text>
<path class="line" d="M500 390 V435" marker-start="url(#arrow)"/>
<text x="515" y="420" class="small" text-anchor="start">Admitted tasks / candidate results</text>
<rect x="60" y="440" width="880" height="185" rx="12" fill="#fbf7f0" stroke="#b6a198"/>
<text x="500" y="470" class="small" text-anchor="middle">.NET worker + shared backend modules · initially in the same process</text>
<rect x="80" y="490" width="260" height="110" rx="12" fill="#f4e5ce" stroke="#80636b" stroke-width="1.8"/>
<text x="210.0" y="521" class="head" text-anchor="middle">Evidence</text>
<text x="210.0" y="549" class="body" text-anchor="middle">Capture, extract, retrieve</text>
<text x="210.0" y="574" class="body" text-anchor="middle">Exact versions and replay</text>
<rect x="370" y="490" width="260" height="110" rx="12" fill="#eee5ed" stroke="#80636b" stroke-width="1.8"/>
<text x="500.0" y="521" class="head" text-anchor="middle">Assessment</text>
<text x="500.0" y="549" class="body" text-anchor="middle">Typed analytical candidates</text>
<text x="500.0" y="574" class="body" text-anchor="middle">Optional debate later</text>
<rect x="660" y="490" width="260" height="110" rx="12" fill="#e8efec" stroke="#80636b" stroke-width="1.8"/>
<text x="790.0" y="521" class="head" text-anchor="middle">Reporting</text>
<text x="790.0" y="549" class="body" text-anchor="middle">Canonical report editions</text>
<text x="790.0" y="574" class="body" text-anchor="middle">Recipient-specific views</text>
<path class="line" d="M340 544 H367"/>
<path class="line" d="M630 544 H657"/>
<text x="500" y="657" class="small" text-anchor="middle">Models propose findings; trusted code owns state, access and release.</text>
<path class="line" d="M180 690 V765" marker-start="url(#arrow)"/>
<rect x="90" y="716" width="180" height="25" fill="#fbf7f0"/>
<text x="180" y="735" class="small" text-anchor="middle">Persist / read</text>
<path class="line" d="M500 690 V765" stroke-dasharray="7 5" marker-start="url(#arrow)"/>
<rect x="410" y="716" width="180" height="25" fill="#fbf7f0"/>
<text x="500" y="735" class="small" text-anchor="middle">Permitted lookup</text>
<path class="line" d="M820 690 V765" marker-start="url(#arrow)"/>
<text x="808" y="735" class="small" text-anchor="end">Checked calls</text>
<text x="808" y="754" class="small" text-anchor="end">Evidence + Assessment</text>
