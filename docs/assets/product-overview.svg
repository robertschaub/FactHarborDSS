<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">The planned FactHarborDSS approach</title>
<desc id="desc">Define the question and, for decisions, human priorities. Examine permitted evidence, preserving sources and gaps. Assess the evidence and challenge reasoning; extra debate agents are selected when required or justified, not used for every request. Present sources, reasons and uncertainty in an inspectable report. Validation and sharing checks remain mandatory; actions need separate authority. This is planned capability, with additional-agent debate and decision support later.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#80636b"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#443d38}.heading{font-size:25px;font-weight:700}.step{font-size:22px;font-weight:700}.body{font-size:20px}.note{font-size:17px}.edge{stroke:#80636b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1000" height="410" rx="16" fill="#fbf7f0"/>
<text class="heading" x="500" y="42" text-anchor="middle">A conclusion you can inspect and challenge</text>
<text class="note" x="500" y="72" text-anchor="middle">Planned approach · evidence informs judgment; people set priorities</text>
<rect x="20" y="105" width="220" height="140" rx="12" fill="#f1e5d6" stroke="#80636b"/>
<text class="step" x="130" y="140" text-anchor="middle">1  Define</text>
<text class="body" x="130" y="178" text-anchor="middle">The exact question</text>
<text class="body" x="130" y="209" text-anchor="middle">Claim or decision</text>
<path class="edge" d="M240 175H264"/>
<rect x="270" y="105" width="220" height="140" rx="12" fill="#f4e5ce" stroke="#80636b"/>
<text class="step" x="380" y="140" text-anchor="middle">2  Examine</text>
<text class="body" x="380" y="178" text-anchor="middle">Permitted evidence</text>
<text class="body" x="380" y="209" text-anchor="middle">Sources and gaps</text>
<path class="edge" d="M490 175H514"/>
<rect x="520" y="105" width="220" height="140" rx="12" fill="#eee5ed" stroke="#80636b"/>
<text class="step" x="630" y="140" text-anchor="middle">3  Assess</text>
<text class="body" x="630" y="178" text-anchor="middle">Weigh the evidence</text>
<text class="body" x="630" y="209" text-anchor="middle">Challenge reasoning</text>
<path class="edge" d="M740 175H764"/>
<rect x="770" y="105" width="210" height="140" rx="12" fill="#e8efec" stroke="#56766b"/>
<text class="step" x="875" y="140" text-anchor="middle">4  Explain</text>
<text class="body" x="875" y="178" text-anchor="middle">An inspectable report</text>
<text class="body" x="875" y="209" text-anchor="middle">Reasons, uncertainty</text>
<text class="note" x="500" y="285" text-anchor="middle">Selected debate agents can challenge and reconcile findings—not vote on truth.</text>
<text class="note" x="500" y="316" text-anchor="middle">Validation and sharing checks remain mandatory. Actions need separate authority.</text>
